version: '3.8'
services:
  postgres:
    container_name: serve-postgres-03  # Cambiar a serve-postgres-04 en el otro
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres  # Usuario por defecto
    ports:
      - "5433:5432"  # Cambia el puerto para evitar conflictos
    networks:
      - network_local_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /home/ubuntu/db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      com.coruha.group: databases

volumes:
  postgres_data:
    driver: local

networks:
  network_local_server:
    driver: bridge
    name: network_local_server
